worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format warehouse
        '$remote_addr "$request_method $uri" status=$status '
        'upstream=$upstream_addr instance=$warehouse_instance '
        'request_time=$request_time upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log warehouse;
    error_log /var/log/nginx/error.log warn;

    map $upstream_http_x_warehouse_instance $warehouse_instance {
        default $upstream_http_x_warehouse_instance;
        "" $upstream_addr;
    }

    upstream warehouse_backend {
        zone warehouse_backend 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;

        server warehouse-app-1:8080 resolve max_fails=1 fail_timeout=10s;
        server warehouse-app-2:8080 resolve max_fails=1 fail_timeout=10s;

        keepalive 32;
    }

    upstream warehouse_management {
        zone warehouse_management 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;

        server warehouse-app-1:8081 resolve max_fails=1 fail_timeout=10s;
        server warehouse-app-2:8081 resolve max_fails=1 fail_timeout=10s;

        keepalive 8;
    }

    server {
        listen 80;

        location = /nginx-health {
            access_log off;
            proxy_pass http://warehouse_management/actuator/health/readiness;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;

            proxy_hide_header X-Warehouse-Instance;
            add_header X-Warehouse-Upstream $upstream_addr always;
            add_header X-Warehouse-Instance $warehouse_instance always;
        }

        location / {
            proxy_pass http://warehouse_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Warehouse-Request-Id $request_id;

            proxy_connect_timeout 2s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;

            proxy_hide_header X-Warehouse-Instance;
            add_header X-Warehouse-Upstream $upstream_addr always;
            add_header X-Warehouse-Instance $warehouse_instance always;
        }
    }
}
