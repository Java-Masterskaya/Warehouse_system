# Test classes run in random order. A test that is green only in its usual slot
# depends on data left by a neighbour: integration tests share one database per run.
# Random order surfaces such coupling immediately instead of months later on someone else's PR.
#
# A specific run is reproducible by the seed JUnit prints to the log:
#   ./gradlew test -Djunit.jupiter.execution.order.random.seed=<seed>
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$Random

# Parallel execution: classes may run concurrently, methods inside a class may not.
# Methods share the fixture built in @BeforeEach, so running them side by side would
# mean rewriting every integration class; the gain would not pay for the risk.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=dynamic
junit.jupiter.execution.parallel.config.dynamic.factor=1

# Integration classes are serialised against each other by @ResourceLock in
# AbstractIntegrationTest: Postgres, Redis and Kafka are shared by the whole run, and
# every class wipes them in @BeforeEach. Two such classes side by side would delete
# each other's data mid-test. Classes that need no Spring context are free to overlap
# with them and with each other.
