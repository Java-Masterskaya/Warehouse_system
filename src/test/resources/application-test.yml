spring:
  datasource:
    url: jdbc:tc:postgresql:16:///warehouse_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  kafka:
    consumer:
      group-id: warehouse-alerts-test
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.warehouse.dto.event"
  cloud:
    consul:
      enabled: false
    compatibility-verifier:
      enabled: false

  cache:
    type: none

  bucket4j:
    enabled: true
    cache:
      type: redis

redis:
  cache:
    categories-ttl-minutes: 10
    item-ttl-minutes: 5

app:
  # Фоновые джобы выключены: они ходят в ту же общую базу, что и интеграционные тесты,
  # и, срабатывая посреди чужого теста, дают невоспроизводимые падения.
  scheduling:
    enabled: false
  # Ретраи Kafka: поведение то же (3 попытки, затем DLT), убрано только ожидание между ними.
  # Боевые 1000ms x2 дают 3 секунды на сообщение и ничего не проверяют в тестах.
  kafka:
    retry:
      initial-interval-ms: 50
      multiplier: 1.0
      max-interval-ms: 100
      max-attempts: 3
  jwt:
    secret: test-secret-key-that-is-at-least-256-bits-long
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
    # Окно ретрая refresh укорочено с боевых 3 секунд: тесты проверяют сам факт истечения
    # кеша, а не конкретную длительность, и ждать три секунды в каждом из них незачем.
    refresh-retry-ttl-seconds: 1
  idempotency:
    ttl-hours: 1
    required: true
    cleanup-cron: "0 0/1 * * * *"
    enforce-after: 2020-01-01  # Дата в прошлом
