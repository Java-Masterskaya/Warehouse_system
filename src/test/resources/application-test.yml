spring:
  datasource:
    url: jdbc:tc:postgresql:16:///warehouse_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  kafka:
    consumer:
      group-id: warehouse-alerts-test
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.warehouse.dto.event"
  cloud:
    consul:
      enabled: false
    compatibility-verifier:
      enabled: false

  cache:
    type: none

redis:
  cache:
    categories-ttl-minutes: 10
    item-ttl-minutes: 5

app:
  jwt:
    secret: test-secret-key-that-is-at-least-256-bits-long
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
    refresh-retry-ttl-seconds: 3
