# yaml-language-server: $schema=https://json.schemastore.org/spring-configuration-properties.json
spring:
  application:
    name: warehouse-app
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        allow.auto.create.topics: false
    consumer:
      group-id: warehouse-alerts
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.warehouse.dto.event"
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
  config:
    import: "optional:consul:"
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: 8500
      config:
        enabled: true
        format: yaml
        prefix: config
        default-context: warehouse-system
  lifecycle:
    timeout-per-shutdown-phase: 20s

app:
  kafka:
    topics:
      low-stock:
        name: low-stock-alerts
        partitions: 3
        replicas: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,env,refresh
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
    refresh:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

server:
  shutdown: graceful

logging:
  level:
    root: WARN
    com.warehouse: INFO