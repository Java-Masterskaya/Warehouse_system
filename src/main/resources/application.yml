# yaml-language-server: $schema=https://json.schemastore.org/spring-configuration-properties.json
spring:
  application:
    name: warehouse-app

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    postgresql:
      transactional-lock: false

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      retries: 3
      properties:
        allow.auto.create.topics: false
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        retry.backoff.ms: 500
    consumer:
      group-id: warehouse-alerts
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.warehouse.dto.event"
    # Настройки для outbox pattern
    outbox:
      polling:
        # Максимальное количество событий для обработки за один вызов
        limit: 100
        # Интервал между опросами в миллисекундах
        interval-ms: 5000
      # Настройки ретраев
      max-retries: 3
      retry-backoff-ms: 5000
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
  config:
    import: "optional:consul:"
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: 8500
      config:
        enabled: true
        format: yaml
        prefix: config
        default-context: warehouse-system
  lifecycle:
    timeout-per-shutdown-phase: 20s

app:
  instance-id: ${INSTANCE_ID:${HOSTNAME:local}}
  audit:
    retention:
      # 1.5 года (18 месяцев) для покрытия закрытия фин. года и проверок в Q1
      days: 547
      batch-size: 5000
  kafka:
    topics:
      low-stock:
        name: low-stock-alerts
        partitions: 3
        replicas: 1
        reprocess-batch-size: 100
    consumer:
      concurrency: 3
    retry:
      initial-interval-ms: 1000
      multiplier: 2.0
      max-interval-ms: 10000
      max-attempts: 3
  jwt:
    refresh-retry-ttl-seconds: 60
    max-active-token-pairs-per-user: ${JWT_MAX_ACTIVE_TOKEN_PAIRS_PER_USER:100}
    refresh-lock:
      wait-timeout-ms: ${JWT_REFRESH_LOCK_WAIT_TIMEOUT_MS:5000}
      ttl-ms: ${JWT_REFRESH_LOCK_TTL_MS:30000}
      retry-interval-ms: ${JWT_REFRESH_LOCK_RETRY_INTERVAL_MS:50}
  idempotency:
    ttl-hours: 24
    required: true # Обязательность заголовка Idempotency-Key
    cleanup-cron: "0 0 * * * *"  # Каждый час
    enforce-after: 2026-08-26

management:
  server:
    port: 8081 # Выделенный порт для Actuator (будет закрыт от внешних пользователей)
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.5}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,env,refresh
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      roles: "ADMIN" # Детали видны только авторизованным пользователям с ролью администратора
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
    refresh:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: warehouse-system
      application_instance: ${app.instance-id}

rate-limiting:
  login:
    ip:
      capacity: 10
      refill-tokens: 2
      duration: 1m
    username:
      capacity: 5
      refill-tokens: 1
      duration: 2m
  movements:
    ip:
      capacity: 100
      refill-tokens: 50
      duration: 1m
    username:
      capacity: 40
      refill-tokens: 10
      duration: 10s

server:
  shutdown: graceful

logging:
  level:
    root: WARN
    com.warehouse: INFO
    com.warehouse.kafka.consumer: WARN
    com.warehouse.service.outbox: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [instance=${app.instance-id}] [traceId=%X{traceId}] [spanId=%X{spanId}] %logger{36} - %msg%n"
