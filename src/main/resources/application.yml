# yaml-language-server: $schema=https://json.schemastore.org/spring-configuration-properties.json
spring:
  application:
    name: warehouse-app
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        allow.auto.create.topics: false
    consumer:
      group-id: warehouse-alerts

  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000

app:
  kafka:
    topics:
      low-stock:
        name: low-stock-alerts
        partitions: 3
        replicas: 1
        reprocess-batch-size: 100
    consumer:
      concurrency: 3
    retry:
      initial-interval-ms: 1000
      multiplier: 2.0
      max-interval-ms: 10000
      max-attempts: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: WARN
    com.warehouse: INFO