plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.5'
    id 'checkstyle'
    id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'com.warehouse'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = '21'
}

repositories {
    mavenCentral()
}

ext {
    testcontainersVersion = '1.21.4'
}

dependencies {
    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.+'
    implementation 'org.mapstruct:mapstruct:1.5.+'
    implementation 'org.springframework.retry:spring-retry'
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-config'
    implementation 'com.bucket4j:bucket4j_jdk17-lettuce:8.19.0'

    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.micrometer:micrometer-tracing'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.prometheus:prometheus-metrics-tracer-initializer:1.3.7'

    // Logs in JSON format
    implementation 'net.logstash.logback:logstash-logback-encoder:9.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'

    // Annotation processors
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.+'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Database
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.+'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.+'

    // Shedlock
    implementation 'net.javacrumbs.shedlock:shedlock-spring:5.10.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:5.10.0'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.atlassian.oai:swagger-request-validator-mockmvc:2.46.1'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.testcontainers:kafka:1.21.4'
    testImplementation 'org.awaitility:awaitility:4.3.0'
    testImplementation "org.testcontainers:testcontainers:${testcontainersVersion}"
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
    testImplementation "org.testcontainers:redpanda:${testcontainersVersion}"
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'

    testRuntimeOnly 'com.h2database:h2'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2024.0.0"
    }
}

test {
    useJUnitPlatform()
    environment 'SPRING_PROFILES_ACTIVE', 'test'
    // Позволяет обновить зафиксированный OpenAPI-снапшот (см. OpenApiSnapshotSupport):
    // ./gradlew test --tests "*OpenApiContractDriftTest" -DupdateOpenApiSnapshot=true
    systemProperty 'updateOpenApiSnapshot', System.getProperty('updateOpenApiSnapshot', 'false')
    // Явно передаём корень проекта — запись снапшота не должна зависеть от рабочей
    // директории форкнутой тестовой JVM (по умолчанию она и так == projectDir, но лучше не гадать).
    systemProperty 'projectRootDir', project.projectDir.absolutePath
}

pitest {
    junit5PluginVersion = '1.2.3'

    targetClasses = [
            'com.warehouse.service.movement.StockMovementServiceImpl',
            'com.warehouse.service.reservation.StockReserveServiceImpl',
            'com.warehouse.service.reservation.StockAvailabilityService',
            'com.warehouse.service.batch.BatchServiceImpl',
            'com.warehouse.service.batch.ExpiredBatchCleanupService'
    ]

    targetTests = [
            'com.warehouse.service.StockMovementServiceImplTest',
            'com.warehouse.service.StockReserveServiceImplTest',
            'com.warehouse.service.StockAvailabilityServiceTest',
            'com.warehouse.service.BatchServiceImplTest',
            'com.warehouse.service.ExpiredBatchCleanupServiceTest'
    ]

    mutators = ['STRONGER']
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
    mutationThreshold = 70
}

checkstyle {
    toolVersion = '10.21.0'
    configFile = file('config/checkstyle/checkstyle.xml')
}

bootRun {
    ['.env', '.env.local'].each { name ->
        def f = file(name)
        if (f.exists()) {
            f.readLines().each { line ->
                def trimmed = line.trim()
                if (trimmed.isEmpty() || trimmed.startsWith('#')) {
                    return
                }
                def parts = trimmed.split('=', 2)
                if (parts.length == 2 && parts[0].trim().length() > 0) {
                    environment parts[0].trim(), parts[1].trim()
                }
            }
        }
    }
}
