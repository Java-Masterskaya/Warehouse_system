x-warehouse-app-environment: &warehouse-app-environment
  SPRING_PROFILES_ACTIVE: "stg"
  SERVER_PORT: "8080"
  MANAGEMENT_SERVER_PORT: "8081"
  POSTGRES_PORT: "5432"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
  CONSUL_HOST: "consul"

x-warehouse-app-common: &warehouse-app-common
  build:
    context: .
  image: warehouse-system:local
  env_file:
    - .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy
    consul:
      condition: service_healthy
    consul-seed:
      condition: service_completed_successfully
  expose:
    - "8080"
    - "8081"
  networks:
    - app-network
  healthcheck:
    test: [ "CMD", "wget", "-qO-", "http://localhost:8081/actuator/health/readiness" ]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s
  restart: unless-stopped
  stop_grace_period: 30s

services:

  # -- Базы данных --
  postgres:
    image: postgres:16
    container_name: postgres
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -t 10 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-backup:
    image: postgres:16-alpine
    container_name: postgres-backup
    env_file:
      - .env
    environment:
      - TZ=${TZ}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - HEALTHCHECK_URL=${HEALTHCHECK_URL:-}
    volumes:
      - postgres_backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
      - ./scripts/restore.sh:/restore.sh:ro
      - ./scripts/backup-entrypoint.sh:/backup-entrypoint.sh:ro
    entrypoint: ["sh", "/backup-entrypoint.sh"]
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "test -f /backups/.last_success && test $(($(date +%s) - $(cat /backups/.last_success))) -lt 90000 || exit 1"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    env_file:
      - .env
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "sh", "-c", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # -- Kafka --
  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.11
    container_name: kafka
    ports:
      - "9092:9092"   # OUTSIDE: для хоста/IDE
      - "29092:29092" # PLAINTEXT: для других контейнеров
      - "18081:8081"  # Schema Registry
    command: >
      redpanda start
      --smp 1
      --overprovisioned
      --node-id 0
      --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      --advertise-kafka-addr PLAINTEXT://kafka:29092,OUTSIDE://localhost:9092
      --schema-registry-addr 0.0.0.0:8081
      --mode dev-container
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "rpk", "cluster", "info" ]
      interval: 15s
      timeout: 10s
      retries: 10

  # -- Spring cloud Consul config --
  consul:
    image: hashicorp/consul:1.16
    container_name: consul
    ports:
      - "8500:8500" # Веб-UI и API Consul
      - "8600:8600/tcp"
      - "8600:8600/udp" # Для DNS
    command: "agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0" # Предусмотрим один сервер
    environment:
      - CONSUL_BIND_INTERFACE=eth0
    volumes:
      - consul_data:/consul/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "consul", "members", "-detailed" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -- Seeding Consul KV --
  consul-seed:
    image: alpine/curl:latest
    container_name: consul-seed
    volumes:
      - ./monitoring/consul:/scripts
      - ./monitoring/consul/warehouse-config.yaml:/warehouse-config.yaml:ro
    environment:
      - CONSUL_HOST=consul
    command: >
      sh -c "
        # Конвертируем скрипт в LF прямо в контейнере
        sed -i 's/\r$//' /scripts/seed.sh &&
        sh /scripts/seed.sh
      "
    networks:
      - app-network
    depends_on:
      consul:
        condition: service_healthy
    restart: "no"  # Запускается один раз и завершается

  # -- Webhook server (для алертов в dev) --
  webhook-server:
    build: ./monitoring/webhook-server
    container_name: webhook-server
    ports:
      - "8082:8082"
    networks:
      - app-network

  # -- Приложение: две stateless реплики --
  warehouse-app-1:
    <<: *warehouse-app-common
    hostname: warehouse-app-1
    ports:
      - "127.0.0.1:${APP1_MANAGEMENT_PORT:-18082}:8081"
    environment:
      <<: *warehouse-app-environment
      INSTANCE_ID: "warehouse-app-1"

  warehouse-app-2:
    <<: *warehouse-app-common
    hostname: warehouse-app-2
    ports:
      - "127.0.0.1:${APP2_MANAGEMENT_PORT:-18083}:8081"
    environment:
      <<: *warehouse-app-environment
      INSTANCE_ID: "warehouse-app-2"

  # -- Public reverse proxy and load balancer --
  nginx:
    image: nginx:1.27.5-alpine
    container_name: warehouse-nginx
    ports:
      - "${PUBLIC_HTTP_PORT:-${SERVER_PORT:-8080}}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      warehouse-app-1:
        condition: service_started
      warehouse-app-2:
        condition: service_started
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # -- Public endpoint probe for Prometheus --
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    container_name: blackbox-exporter
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    expose:
      - "9115"
    networks:
      - app-network
    restart: unless-stopped

  # -- Prometheus --
  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--enable-feature=exemplar-storage'
    depends_on:
      - blackbox-exporter
    networks:
      - app-network

  # -- Alertmanager --
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager
    networks:
      - app-network

  # -- Grafana --
  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml
      - ./monitoring/grafana/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml
      - ./monitoring/grafana/dashboards/warehouse.json:/etc/grafana/provisioning/dashboards/warehouse.json
      - ./monitoring/grafana/datasources/tempo.yaml:/etc/grafana/provisioning/datasources/tempo.yaml
      - ./monitoring/grafana/datasources/loki.yml:/etc/grafana/provisioning/datasources/loki.yml
    networks:
      - app-network

  # -- Tempo --
  tempo:
    image: grafana/tempo:latest
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./monitoring/tempo/tempo-config.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"
      - "4318:4318"
    networks:
      - app-network

  # --- Loki ---
  loki:
    image: grafana/loki:3.7.3
    container_name: loki
    expose:
      - "3100"
    networks:
      - app-network
    command:
      -config.file=/etc/loki/loki-config.yaml
      -config.expand-env=true
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # --- Promtail ---
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp/positions.yaml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - app-network
    depends_on:
      - loki

volumes:
  postgres_data:
  redis_data:
  consul_data:
  postgres_backups:
  loki-data:
  promtail_positions:

networks:
  app-network:
    driver: bridge
