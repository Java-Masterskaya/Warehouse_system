services:

  # -- Базы данных --
  postgres:
    image: postgres:16
    container_name: postgres
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -t 10 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-backup:
    image: postgres:16-alpine
    container_name: postgres-backup
    env_file:
      - .env
    environment:
      - TZ=${TZ}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - HEALTHCHECK_URL=${HEALTHCHECK_URL:-}
    volumes:
      - postgres_backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
      - ./scripts/restore.sh:/restore.sh:ro
      - ./scripts/backup-entrypoint.sh:/backup-entrypoint.sh:ro
    entrypoint: ["/backup-entrypoint.sh"]
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "test -f /backups/.last_success && test $(($(date +%s) - $(cat /backups/.last_success))) -lt 90000 || exit 1"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    env_file:
      - .env
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "sh", "-c", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # -- Kafka --
  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.11
    container_name: kafka
    ports:
      - "9092:9092"   # OUTSIDE: для хоста/IDE
      - "29092:29092" # PLAINTEXT: для других контейнеров
      - "8081:8081"   # Schema Registry
    command: >
      redpanda start
      --smp 1
      --overprovisioned
      --node-id 0
      --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      --advertise-kafka-addr PLAINTEXT://kafka:29092,OUTSIDE://localhost:9092
      --schema-registry-addr 0.0.0.0:8081
      --mode dev-container
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "rpk", "cluster", "info" ]
      interval: 15s
      timeout: 10s
      retries: 10

  # -- Spring cloud Consul config --
  consul:
    image: hashicorp/consul:1.16
    container_name: consul
    ports:
      - "8500:8500" # Веб-UI и API Consul
      - "8600:8600/tcp"
      - "8600:8600/udp" # Для DNS
    command: "agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0" # Предусмотрим один сервер
    environment:
      - CONSUL_BIND_INTERFACE=eth0
    volumes:
      - consul_data:/consul/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "consul", "members", "-detailed" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -- Seeding Consul KV --
  consul-seed:
    image: alpine/curl:latest
    container_name: consul-seed
    volumes:
      - ./monitoring/consul:/scripts
      - ./monitoring/consul/warehouse-config.yaml:/warehouse-config.yaml:ro
    environment:
      - CONSUL_HOST=consul
    command: >
      sh -c "
        # Конвертируем скрипт в LF прямо в контейнере
        sed -i 's/\r$//' /scripts/seed.sh &&
        sh /scripts/seed.sh
      "
    networks:
      - app-network
    depends_on:
      consul:
        condition: service_healthy
    restart: "no"  # Запускается один раз и завершается

  # -- Приложение --
  warehouse-app:
    build: .
    container_name: warehouse-app
    ports:
      - "${SERVER_PORT}:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      consul:
        condition: service_healthy
      consul-seed:
        condition: service_completed_successfully
    networks:
      - app-network

    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -- Prometheus --
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - app-network

  # -- Grafana --
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml
      - ./monitoring/grafana/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml
      - ./monitoring/grafana/dashboards/warehouse.json:/etc/grafana/provisioning/dashboards/warehouse.json
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  consul_data:
  postgres_backups:

networks:
  app-network:
    driver: bridge