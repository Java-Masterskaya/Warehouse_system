server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [ '__meta_docker_container_name' ]
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: [ '__meta_docker_image_name' ]
        target_label: 'image'
      - source_labels: [ '__meta_docker_container_name' ]
        regex: '/(warehouse-app|postgres|redis|kafka).*'
        action: keep
    pipeline_stages:
      - docker: { }
      - json:
          expressions:
            timestamp: timestamp
            message: message
            logger: logger
            level: level
            application: application
            traceId: traceId
            spanId: spanId
      - timestamp:
          source: timestamp
          format: ISO8601
      - labels:
          level:
          application:
          container: