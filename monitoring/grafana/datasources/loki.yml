apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    jsonData:
      derivedFields:
        - name: traceId
          matcherRegex: 'traceId":"(\w{32})'
          url: "$${__value.raw}"
          datasourceUid: tempo