auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    chunks_directory: /loki/chunks
    rules_directory: /loki/rules
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

limits_config:
  retention_period: ${RETENTION_PERIOD:-168h}
  max_streams_per_user: ${MAX_STREAMS_PER_USER:-10000}
  max_entries_limit_per_query: ${MAX_ENTRIES_LIMIT:-5000}
  reject_old_samples: ${REJECT_OLD_SAMPLES:-true}
  reject_old_samples_max_age: ${RETENTION_PERIOD:-168h}
  query_timeout: ${QUERY_TIMEOUT:-30s}
  max_query_parallelism: 32
  max_query_lookback: ${RETENTION_PERIOD:-168h}

compactor:
  working_directory: /loki/compactor
  compaction_interval: ${COMPACTION_INTERVAL:-10m}
  retention_enabled: ${RETENTION_DELETES_ENABLED:-true}

query_scheduler:
  max_outstanding_requests_per_tenant: ${MAX_OUTSTANDING:-1000}

querier:
  max_concurrent: 10