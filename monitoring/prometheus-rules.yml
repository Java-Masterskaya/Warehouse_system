groups:
  - name: warehouse-alerts
    rules:
      - alert: Brute-force login
        expr: rate(warehouse_auth_login_failure_total[1m]) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Brute-force login detected"
          description: "High rate of login failures: {{ $value | humanize }} failures/s"

      - alert: Rejected write-off rate high
        expr: rate(warehouse_movements_writeoff_rejected_total[5m]) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High rejected write-off rate"
          description: "Rejected write-off rate is {{ $value | humanize }} per 5 minutes"

      - alert: Low-stock alert spike
        expr: rate(warehouse_stock_low_alert_total[5m]) > 3
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Low-stock alert spike"
          description: "Low-stock alerts: {{ $value | humanize }} per 5 minutes"

      - alert: App down
        expr: up{job="warehouse-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Warehouse app is down"
          description: "App warehouse-app has been down for more than 1 minute"

      - alert: JVM heap > 90%
        expr: sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap", id!="G1 Eden Space", id!="G1 Survivor Space"}) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM heap usage > 90%"
          description: "JVM heap usage is {{ $value | humanize }}%"