global:
  scrape_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  - job_name: warehouse-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['warehouse-app:8080']

rule_files:
  - /etc/prometheus/prometheus-rules.yml
