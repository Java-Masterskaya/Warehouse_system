name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Check Docker
        run: |
          docker --version
          docker info
          docker system df

      - name: Configure Testcontainers
        run: |
          echo "TESTCONTAINERS_RYUK_DISABLED=true" >> $GITHUB_ENV
          echo "TESTCONTAINERS_REUSE_ENABLE=true" >> $GITHUB_ENV
          echo "TESTCONTAINERS_CHECKS_TIMEOUT=120" >> $GITHUB_ENV
          echo "DOCKER_HOST=unix:///var/run/docker.sock" >> $GITHUB_ENV

      - name: Run all tests
        run: |
          ./gradlew test --no-daemon \
            -Dtestcontainers.ryuk.disabled=true \
            -Dtestcontainers.reuse.enable=true \
            -Dtestcontainers.checks.timeout=120

      - name: Build JAR
        run: |
          ./gradlew assemble --no-daemon

      - name: Build Docker image
        run: docker build --tag warehouse-system:${{ github.sha }} .